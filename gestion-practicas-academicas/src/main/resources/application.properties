# Configuracion del servidor
server.port=8080

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_practicas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=practicas_user
spring.datasource.password=practicas2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuracion de logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.level.com.gestionpracticas=DEBUG

# Configuracion de Spring Security (temporalmente deshabilitado para desarrollo)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration