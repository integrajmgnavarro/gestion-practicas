<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - ' : ''} + 'Gestión de Prácticas'">Gestión de Prácticas</title>
    
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Tailwind and Custom Colors/Font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-color': '#1D4ED8', // Azul oscuro
                        'secondary-color': '#4B5563', // Gris oscuro
                        'success-color': '#10B981', // Verde esmeralda
                        'danger-color': '#F87171', // Rojo suave
                        'warning-color': '#FBBF24', // Amarillo ámbar
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons (Aún necesarios para los iconos) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom Tailwind Styles for Components (e.g., subtle shadow and rounded corners) -->
    <style>
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .sidebar-menu a {
            transition: all 0.2s;
        }
    </style>
    
    <!-- Additional CSS block for child pages (Thymeleaf fragment) -->
    <th:block th:fragment="extra-css"></th:block>
</head>

<body class="min-h-screen flex flex-col font-sans bg-gray-50 antialiased">
    <!-- Navbar (Will be replaced by a modern Tailwind version) -->
    <!-- The th:replace syntax is preserved to integrate your existing Navbar fragment -->
    <div th:replace="~{common/navbar :: navbar}" class="shadow-md sticky top-0 z-40"></div>
    
    <!-- Main Content Wrapper -->
    <div class="flex-1 py-8 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Alerts/Messages -->
        <div class="space-y-4 mb-6">
            <!-- Success Alert -->
            <div th:if="${success}" id="alert-success" class="flex items-center p-4 mb-4 text-success-color border border-success-color/50 rounded-lg bg-success-color/10" role="alert">
                <i class="bi bi-check-circle-fill text-lg me-3"></i>
                <div class="text-sm font-medium flex-1">
                    <span th:text="${success}">Operación exitosa</span>
                </div>
                <button type="button" class="ml-auto -mx-1.5 -my-1.5 bg-success-color/10 text-success-color rounded-lg p-1.5 hover:bg-success-color/20 inline-flex items-center justify-center h-8 w-8" data-dismiss="alert-success">
                    <span class="sr-only">Cerrar</span>
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            
            <!-- Error Alert -->
            <div th:if="${error}" id="alert-error" class="flex items-center p-4 mb-4 text-danger-color border border-danger-color/50 rounded-lg bg-danger-color/10" role="alert">
                <i class="bi bi-exclamation-triangle-fill text-lg me-3"></i>
                <div class="text-sm font-medium flex-1">
                    <span th:text="${error}">Ha ocurrido un error</span>
                </div>
                <button type="button" class="ml-auto -mx-1.5 -my-1.5 bg-danger-color/10 text-danger-color rounded-lg p-1.5 hover:bg-danger-color/20 inline-flex items-center justify-center h-8 w-8" data-dismiss="alert-error">
                    <span class="sr-only">Cerrar</span>
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            
            <!-- Info Alert -->
            <div th:if="${message}" id="alert-info" class="flex items-center p-4 mb-4 text-primary-color border border-primary-color/50 rounded-lg bg-primary-color/10" role="alert">
                <i class="bi bi-info-circle-fill text-lg me-3"></i>
                <div class="text-sm font-medium flex-1">
                    <span th:text="${message}">Información</span>
                </div>
                <button type="button" class="ml-auto -mx-1.5 -my-1.5 bg-primary-color/10 text-primary-color rounded-lg p-1.5 hover:bg-primary-color/20 inline-flex items-center justify-center h-8 w-8" data-dismiss="alert-info">
                    <span class="sr-only">Cerrar</span>
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
        
        <!-- Page Content fragment -->
        <th:block layout:fragment="content">
            <div class="p-6 bg-white rounded-xl card-shadow">
                <p class="text-gray-500">Contenido de la página (Placeholder)</p>
            </div>
        </th:block>
    </div>
    
    <!-- Footer (Will be replaced by a modern Tailwind version) -->
    <!-- The th:replace syntax is preserved to integrate your existing Footer fragment -->
    <div th:replace="~{common/footer :: footer}" class="border-t border-gray-200 mt-auto bg-white"></div>
    
    <!-- Additional JS block for child pages (Thymeleaf fragment) -->
    <th:block th:fragment="extra-js"></th:block>
    
    <script>
        // Custom JS to handle alert dismissal and auto-hide logic
        document.addEventListener('DOMContentLoaded', () => {
            
            // Auto-hide alerts after 5 seconds
            const autoHideAlerts = () => {
                document.querySelectorAll('[id^="alert-"]').forEach(alertElement => {
                    setTimeout(() => {
                        alertElement.classList.add('hidden');
                    }, 5000);
                });
            };

            // Manual dismissal handler
            document.querySelectorAll('[data-dismiss^="alert-"]').forEach(button => {
                button.addEventListener('click', (e) => {
                    const alertId = e.currentTarget.getAttribute('data-dismiss');
                    document.getElementById(alertId).classList.add('hidden');
                });
            });

            // Run auto-hide logic on load
            autoHideAlerts();
        });
    </script>
</body>
</html>
