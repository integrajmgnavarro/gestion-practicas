<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión de Prácticas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'primary-start': '#667eea', // Color de inicio del gradiente (Púrpura/Azul)
                'primary-end': '#764ba2',   // Color final del gradiente (Morado)
              }
            }
          }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="absolute inset-0 bg-gradient-to-br from-primary-start to-primary-end"></div>

    <div class="relative w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden m-4">
        
        <div class="p-8 text-center text-white bg-gradient-to-br from-primary-start to-primary-end">
            <i class="bi bi-briefcase-fill text-5xl mb-2"></i>
            <h2 class="text-2xl font-semibold mb-1">Gestión de Prácticas</h2>
            <p class="text-sm opacity-90">Inicia sesión para continuar</p>
        </div>
        
        <div class="p-8">
            <div th:if="${param.error}" 
                 class="p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg dark:bg-red-200 dark:text-red-800 flex items-center" 
                 role="alert">
                <i class="bi bi-exclamation-triangle-fill mr-2"></i>
                <span th:text="${error} ?: 'Usuario o contraseña incorrectos'">Error de autenticación</span>
            </div>
            
            <div th:if="${param.logout}" 
                 class="p-4 mb-4 text-sm text-green-700 bg-green-100 rounded-lg dark:bg-green-200 dark:text-green-800 flex items-center" 
                 role="alert">
                <i class="bi bi-check-circle-fill mr-2"></i>
                Sesión cerrada correctamente
            </div>
            
            <div th:if="${param.registered}" 
                 class="p-4 mb-4 text-sm text-green-700 bg-green-100 rounded-lg dark:bg-green-200 dark:text-green-800 flex items-center" 
                 role="alert">
                <i class="bi bi-check-circle-fill mr-2"></i>
                Usuario registrado correctamente. Ya puedes iniciar sesión
            </div>

            <form th:action="@{/auth/login}" method="post" class="space-y-6">
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="bi bi-envelope mr-1"></i> Email
                    </label>
                    <input type="email" 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150" 
                           id="email" 
                           name="username" 
                           placeholder="correo@ejemplo.com" 
                           required 
                           autofocus>
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="bi bi-lock mr-1"></i> Contraseña
                    </label>
                    <input type="password" 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150" 
                           id="password" 
                           name="password" 
                           placeholder="Contraseña" 
                           required>
                </div>
                
                <div class="flex items-center">
                    <input class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" 
                           type="checkbox" 
                           id="remember-me" 
                           name="remember-me">
                    <label class="ml-2 block text-sm text-gray-900" for="remember-me">
                        Recordarme
                    </label>
                </div>
                
                <button type="submit" 
                        class="w-full py-3 text-white font-semibold rounded-lg bg-blue-600 hover:bg-blue-700 transition duration-200 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                    <i class="bi bi-box-arrow-in-right mr-2"></i>
                    Iniciar Sesión
                </button>
            </form>
        </div>
        
        <div class="p-4 text-center text-sm text-gray-500 border-t bg-gray-50">
            <p class="mb-0">
                <small>¿No tienes cuenta? Contacta con el administrador</small>
            </p>
        </div>
    </div>
</body>
</html>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
