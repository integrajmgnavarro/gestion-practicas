<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestión de Prácticas</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        
        .register-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }
        
        .register-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .register-header h2 {
            margin: 0;
            font-weight: 600;
        }
        
        .register-body {
            padding: 30px;
        }
        
        .btn-register {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="register-card">
                    <!-- Header -->
                    <div class="register-header">
                        <i class="bi bi-person-plus-fill" style="font-size: 3rem;"></i>
                        <h2>Crear Cuenta</h2>
                        <p>Completa el formulario para registrarte</p>
                    </div>
                    
                    <!-- Body -->
                    <div class="register-body">
                        <!-- Alerts -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error}">Error</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- Register Form -->
                        <form th:action="@{/auth/register}" 
                              th:object="${usuarioCreateDTO}" 
                              method="post">
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="bi bi-envelope"></i> Email
                                </label>
                                <input type="email" 
                                       class="form-control" 
                                       id="email" 
                                       th:field="*{email}" 
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Error de email
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> Contraseña
                                </label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       th:field="*{password}" 
                                       required 
                                       minlength="6">
                                <div class="form-text">Mínimo 6 caracteres</div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                    Error de contraseña
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="rol" class="form-label">
                                    <i class="bi bi-person-badge"></i> Rol
                                </label>
                                <select class="form-select" id="rol" th:field="*{rol}" required>
                                    <option value="">Seleccionar rol...</option>
                                    <option value="ALUMNO">Alumno</option>
                                    <option value="TUTOR_PRACTICAS">Tutor de Prácticas</option>
                                    <option value="TUTOR_CURSO">Tutor de Curso</option>
                                    <option value="ADMIN">Administrador</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}">
                                    Error de rol
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="referenceId" class="form-label">
                                    <i class="bi bi-link-45deg"></i> ID de Referencia (opcional)
                                </label>
                                <input type="number" 
                                       class="form-control" 
                                       id="referenceId" 
                                       th:field="*{referenceId}">
                                <div class="form-text">ID del alumno, tutor o empresa según el rol</div>
                            </div>
                            
                            <div class="form-check mb-3">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       id="terms" 
                                       required>
                                <label class="form-check-label" for="terms">
                                    Acepto los términos y condiciones
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-register">
                                <i class="bi bi-person-plus me-2"></i>
                                Registrarse
                            </button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-0">
                                ¿Ya tienes cuenta? 
                                <a th:href="@{/auth/login}" class="text-decoration-none">Inicia sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
                
                <!-- Back to login -->
                <div class="text-center mt-3">
                    <a th:href="@{/auth/login}" class="text-white text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Volver al login
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
