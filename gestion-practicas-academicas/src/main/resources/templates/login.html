<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Iniciar Sesión</title>
    <!-- 
        SOLUCIÓN TEMPORAL PARA EL ESTILO:
        Se mantiene el CDN de Tailwind para asegurar la carga correcta de los estilos
        en el entorno de desarrollo.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div layout:fragment="content" class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
        
        <!-- Formulario de Login -->
        <div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl max-w-sm w-full border-t-8 border-purple-600">
            
            <div class="text-center mb-8">
                <i class="bi bi-person-circle text-6xl text-purple-600 mb-2"></i>
                <h1 class="text-3xl font-extrabold text-gray-900">
                    Acceso al Sistema
                </h1>
                <p class="text-gray-500 text-sm mt-1">
                    Introduce tus credenciales para continuar
                </p>
            </div>

            <!-- Formulario Thymeleaf (Asegúrate de que la acción y los nombres de campo coincidan con tu backend de Spring Security) -->
            <form th:action="@{/login}" method="post" class="space-y-6">
                
                <!-- Campo Email/Usuario -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                        Email o Nombre de Usuario
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required 
                           autocomplete="username"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                           placeholder="ejemplo@centro.es"/>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        Contraseña
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required 
                           autocomplete="current-password"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                           placeholder="••••••••"/>
                </div>

                <!-- Mensaje de Error (Ejemplo de Spring Security) -->
                <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                    <span class="block sm:inline">Credenciales inválidas. Por favor, inténtalo de nuevo.</span>
                </div>

                <!-- Botón de Iniciar Sesión -->
                <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 transition duration-150 transform hover:scale-[1.01] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                    <i class="bi bi-box-arrow-in-right mr-2 text-xl"></i>
                    Iniciar Sesión
                </button>
            </form>
            
            <p class="mt-6 text-center text-xs text-gray-400">
                ¿Olvidaste tu contraseña? <a th:href="@{/forgot-password}" class="text-purple-600 hover:text-purple-800 font-medium">Recuperar</a>
            </p>

        </div>
        
    </div>
</body>
</html>
