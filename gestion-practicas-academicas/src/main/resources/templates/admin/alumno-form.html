<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{common/layout}">
<head>
<!-- Título Dinámico: Adapta el título si tiene ID (Editar) o no (Nuevo) -->
<title th:text="${alumno.id != null ? 'Editar Alumno: ' + alumno.nombre : 'Nuevo Alumno'}">Formulario de Alumno</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<th:block layout:fragment="extra-css"></th:block>
</head>
<body>
<div layout:fragment="content" class="p-4 md:p-8">

<!-- ENCABEZADO DINÁMICO -->
<div class="bg-white p-6 rounded-xl shadow-xl mb-6 border-t-4 border-blue-600">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-1">
        <i class="bi bi-person-circle text-blue-600 mr-2"></i>
        <span th:text="${alumno.id != null ? 'Editar Alumno' : 'Registrar Nuevo Alumno'}">Título</span>
    </h1>
    <p class="text-gray-500 text-sm" 
       th:text="${alumno.id != null ? 'Modifica los datos del alumno con ID: ' + alumno.id : 'Completa los campos para dar de alta un nuevo alumno.'}">
       Descripción dinámica
    </p>
</div>

<div class="bg-white shadow-xl rounded-xl p-6">
    
    <!-- FORMULARIO UNIFICADO: La acción es la misma, el ID oculto indica si es edición -->
    <form th:action="@{/admin/alumnos/guardar}" th:object="${alumno}" method="post">
        
        <!-- ID Oculto (CRUCIAL para diferenciar Edición de Creación) -->
        <input type="hidden" th:field="*{id}" />

        <h2 class="text-xl font-semibold text-gray-800 border-b pb-2 mb-4"><i class="bi bi-person-fill text-blue-500 mr-2"></i>Datos Personales</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
            
            <!-- Campo Nombre -->
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5"
                       placeholder="Ej: Juan">
                <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <!-- Campo Apellidos -->
            <div>
                <label for="apellidos" class="block text-sm font-medium text-gray-700">Apellidos</label>
                <input type="text" id="apellidos" th:field="*{apellidos}" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5"
                       placeholder="Ej: Pérez García">
                <p th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <!-- Campo DNI -->
            <div>
                <label for="dni" class="block text-sm font-medium text-gray-700">DNI</label>
                <input type="text" id="dni" th:field="*{dni}" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5"
                       placeholder="Ej: 12345678A">
                <p th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="mt-1 text-sm text-red-600"></p>
            </div>
            
            <!-- Campo Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" th:field="*{email}" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5"
                       placeholder="Ej: juan.perez@email.com">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-red-600"></p>
            </div>
        </div>

        <h2 class="text-xl font-semibold text-gray-800 border-b pb-2 mt-6 mb-4"><i class="bi bi-book text-blue-500 mr-2"></i>Detalles Académicos</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            
            <!-- Campo Curso (Necesita 'cursosDisponibles' en el modelo) -->
            <div>
                <label for="cursoId" class="block text-sm font-medium text-gray-700">Curso Asignado</label>
                <select id="cursoId" th:field="*{cursoId}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5">
                    <option value="">-- Seleccione un Curso --</option>
                    <option th:each="curso : ${cursosDisponibles}" 
                            th:value="${curso.id}" 
                            th:text="${curso.nombre + ' (' + curso.codigo + ')'}">
                        Curso de Ejemplo (C001)
                    </option>
                </select>
                <p th:if="${#fields.hasErrors('cursoId')}" th:errors="*{cursoId}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <!-- Campo Empresa (Necesita 'empresasDisponibles' en el modelo) -->
            <div>
                <label for="empresaId" class="block text-sm font-medium text-gray-700">Empresa de Prácticas (Opcional)</label>
                <select id="empresaId" th:field="*{empresaId}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5">
                    <option value="">-- No Asignar Empresa --</option>
                    <option th:each="empresa : ${empresasDisponibles}" 
                            th:value="${empresa.id}" 
                            th:text="${empresa.nombre + ' (' + empresa.cif + ')'}">
                        Empresa S.L. (A12345678)
                    </option>
                </select>
                <p th:if="${#fields.hasErrors('empresaId')}" th:errors="*{empresaId}" class="mt-1 text-sm text-red-600"></p>
            </div>
            
            <!-- Campo Activo (Solo se muestra y es relevante en modo edición) -->
            <div th:if="${alumno.id != null}">
                <label for="activo" class="block text-sm font-medium text-gray-700">Estado del Alumno</label>
                <select id="activo" th:field="*{activo}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
                <p th:if="${#fields.hasErrors('activo')}" th:errors="*{activo}" class="mt-1 text-sm text-red-600"></p>
            </div>

        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="pt-5 border-t mt-8 flex justify-end space-x-3">
            
            <!-- Botón Guardar/Actualizar (Texto dinámico) -->
            <button type="submit" 
                    class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 transition duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                <i class="bi bi-save mr-2"></i>
                <span th:text="${alumno.id != null ? 'Actualizar Alumno' : 'Guardar Alumno'}">Guardar</span>
            </button>

            <!-- Botón Cancelar -->
            <a th:href="@{/admin/alumnos}"
               class="inline-flex items-center px-6 py-3 border border-gray-300 text-base font-medium rounded-lg shadow-sm text-gray-700 bg-white hover:bg-gray-50 transition duration-150">
                <i class="bi bi-x-circle mr-2"></i> Volver al Listado
            </a>
        </div>
    </form>
</div>


</div>
</body>
</html>
