<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Editar Alumno' : 'Crear Nuevo Alumno'">Título del Formulario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos básicos para el formulario */
        .container-form { max-width: 800px; margin: 2rem auto; padding: 1.5rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .form-group label { font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; transition: border-color 0.15s ease-in-out; }
        .error-message { color: #e53e3e; font-size: 0.875rem; margin-top: 0.25rem; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="container-form">
        <h1 class="text-3xl font-bold mb-6 text-gray-800 border-b pb-2" 
            th:text="${isEdit} ? 'Editar Datos del Alumno' : 'Crear Nuevo Alumno'">Encabezado</h1>

        <!-- 
            ========================================================================
            BLOQUES DE FORMULARIO CONDICIONALES PARA EVITAR EL ERROR EL1008E
            Hemos separado los formularios de Creación y Edición para que Thymeleaf
            solo procese la URL y el campo ID que son relevantes para el DTO actual.
            ========================================================================
        -->

        <!-- 1. Formulario de EDICIÓN (isEdit == true) -->
        <form th:if="${isEdit}"
              th:action="@{/admin/alumnos/{id}/editar(id=${alumno.id})}" 
              th:object="${alumno}" 
              method="post">
            
            <!-- Campo oculto ID (Necesario solo en edición) -->
            <input type="hidden" th:field="*{id}" />
            
            <!-- Fragmento de Contenido del Formulario (th:insert simula un fragmento para evitar duplicación) -->
            <div th:replace="~{::formContent}"></div>

            <!-- Botón de Acción para EDICIÓN -->
            <div class="md:col-span-2 flex justify-end space-x-4 mt-8">
                <a th:href="@{/admin/alumnos}" class="px-4 py-2 bg-gray-500 text-white font-semibold rounded-lg shadow-md hover:bg-gray-600 transition duration-150">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition duration-150">
                    Guardar Cambios
                </button>
            </div>
        </form>

        <!-- 2. Formulario de CREACIÓN (isEdit == false) -->
        <form th:if="${!isEdit}"
              th:action="@{/admin/alumnos/nuevo}" 
              th:object="${alumno}" 
              method="post">
            
            <!-- Fragmento de Contenido del Formulario -->
            <div th:replace="~{::formContent}"></div>

            <!-- Botón de Acción para CREACIÓN -->
            <div class="md:col-span-2 flex justify-end space-x-4 mt-8">
                <a th:href="@{/admin/alumnos}" class="px-4 py-2 bg-gray-500 text-white font-semibold rounded-lg shadow-md hover:bg-gray-600 transition duration-150">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition duration-150">
                    Crear Alumno
                </button>
            </div>
        </form>
        
        <!-- 
            ========================================================================
            BLOQUE DE CONTENIDO COMPARTIDO DEL FORMULARIO
            Contiene todos los campos que son comunes a AlumnoCreateDTO y AlumnoUpdateDTO.
            ========================================================================
        -->
        <div th:fragment="formContent">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Seccion 1: Datos Personales Obligatorios -->
                <div class="md:col-span-2 text-xl font-semibold mt-4 mb-2 border-b pb-1">Datos Personales</div>

                <!-- Nombre -->
                <div class="form-group">
                    <label for="nombre" class="block mb-1">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="focus:border-blue-500 rounded-lg" />
                    <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-message">Error Nombre</span>
                </div>

                <!-- Apellidos -->
                <div class="form-group">
                    <label for="apellidos" class="block mb-1">Apellidos</label>
                    <input type="text" id="apellidos" th:field="*{apellidos}" class="focus:border-blue-500 rounded-lg" />
                    <span th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="error-message">Error Apellidos</span>
                </div>

                <!-- DNI -->
                <div class="form-group">
                    <label for="dni" class="block mb-1">DNI</label>
                    <input type="text" id="dni" th:field="*{dni}" class="focus:border-blue-500 rounded-lg" />
                    <span th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="error-message">Error DNI</span>
                </div>

                <!-- Fecha Nacimiento -->
                <div class="form-group">
                    <label for="fechaNacimiento" class="block mb-1">Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" class="focus:border-blue-500 rounded-lg" />
                    <span th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}" class="error-message">Error Fecha Nacimiento</span>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="block mb-1">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="focus:border-blue-500 rounded-lg" />
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message">Error Email</span>
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label for="telefono" class="block mb-1">Teléfono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="focus:border-blue-500 rounded-lg" />
                    <span th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error-message">Error Teléfono</span>
                </div>

                <!-- Seccion 2: Relaciones y Estado -->
                <div class="md:col-span-2 text-xl font-semibold mt-4 mb-2 border-b pb-1">Relaciones y Estado</div>

                <!-- CURSO (ID) -->
                <div class="form-group">
                    <label for="cursoId" class="block mb-1">Curso Asignado</label>
                    <select id="cursoId" th:field="*{cursoId}" class="focus:border-blue-500 rounded-lg">
                        <option value="">Seleccione un Curso</option>
                        <option th:each="curso : ${cursos}" 
                                th:value="${curso.id}" 
                                th:text="${curso.nombre}">Nombre del Curso</option>
                    </select>
                    <span th:if="${#fields.hasErrors('cursoId')}" th:errors="*{cursoId}" class="error-message">Error Curso</span>
                </div>

                <!-- TUTOR DE CURSO (ID) -->
                <div class="form-group">
                    <label for="tutorCursoId" class="block mb-1">Tutor de Curso</label>
                    <select id="tutorCursoId" th:field="*{tutorCursoId}" class="focus:border-blue-500 rounded-lg">
                        <option value="">(Opcional) Seleccione un Tutor</option>
                        <option th:each="tutor : ${tutoresCurso}" 
                                th:value="${tutor.id}" 
                                th:text="${tutor.nombre} + ' ' + ${tutor.apellidos}">Nombre del Tutor de Curso</option>
                    </select>
                </div>

                <!-- EMPRESA (ID) -->
                <div class="form-group">
                    <label for="empresaId" class="block mb-1">Empresa de Prácticas</label>
                    <select id="empresaId" th:field="*{empresaId}" class="focus:border-blue-500 rounded-lg">
                        <option value="">(Opcional) Seleccione una Empresa</option>
                        <option th:each="empresa : ${empresas}" 
                                th:value="${empresa.id}" 
                                th:text="${empresa.nombre}">Nombre de la Empresa</option>
                    </select>
                </div>

                <!-- TUTOR DE PRÁCTICAS (ID) -->
                <div class="form-group">
                    <label for="tutorPracticasId" class="block mb-1">Tutor de Prácticas</label>
                    <select id="tutorPracticasId" th:field="*{tutorPracticasId}" class="focus:border-blue-500 rounded-lg">
                        <option value="">(Opcional) Seleccione un Tutor de Prácticas</option>
                        <option th:each="tutor : ${tutoresPracticas}" 
                                th:value="${tutor.id}" 
                                th:text="${tutor.nombre} + ' ' + ${tutor.apellidos}">Nombre del Tutor de Prácticas</option>
                    </select>
                </div>
                
                <!-- Activo (Checkbox) -->
                <div class="form-group flex items-center mt-2">
                    <input type="checkbox" id="activo" th:field="*{activo}" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 mr-2" />
                    <label for="activo" class="text-sm">Activo</label>
                </div>

                <!-- Contratado (Checkbox) -->
                <div class="form-group flex items-center mt-2">
                    <input type="checkbox" id="contratado" th:field="*{contratado}" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 mr-2" />
                    <label for="contratado" class="text-sm">Contratado</label>
                </div>


                <!-- Seccion 3: Datos de Prácticas (Opcionales) -->
                <div class="md:col-span-2 text-xl font-semibold mt-4 mb-2 border-b pb-1">Datos de Prácticas</div>

                <!-- Duración Prácticas (en horas o semanas, según tu lógica) -->
                <div class="form-group">
                    <label for="duracionPracticas" class="block mb-1">Duración Prácticas</label>
                    <input type="number" id="duracionPracticas" th:field="*{duracionPracticas}" class="focus:border-blue-500 rounded-lg" placeholder="Ej: 300 horas" />
                </div>

                <!-- Horario -->
                <div class="form-group">
                    <label for="horario" class="block mb-1">Horario</label>
                    <input type="text" id="horario" th:field="*{horario}" class="focus:border-blue-500 rounded-lg" placeholder="Ej: L-V 9:00-14:00" />
                </div>

                <!-- Fecha Inicio -->
                <div class="form-group">
                    <label for="fechaInicio" class="block mb-1">Fecha de Inicio de Prácticas</label>
                    <input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="focus:border-blue-500 rounded-lg" />
                </div>

                <!-- Fecha Fin -->
                <div class="form-group">
                    <label for="fechaFin" class="block mb-1">Fecha de Fin de Prácticas</label>
                    <input type="date" id="fechaFin" th:field="*{fechaFin}" class="focus:border-blue-500 rounded-lg" />
                </div>

            </div>
        </div>

    </div>

</body>
</html>
