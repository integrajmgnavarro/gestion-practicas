<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}"> 
<head>
    <title layout:fragment="pageTitle">Nuevo Tutor de Curso</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <th:block layout:fragment="extra-css"></th:block>
</head>
<body>
    <div layout:fragment="content" class="p-4 md:p-8 max-w-4xl mx-auto">
        
        <div class="bg-white p-6 rounded-xl shadow-xl mb-6 border-t-4 border-red-600">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-1">
                <i class="bi bi-person-workspace text-red-600 mr-2"></i>
                Crear Nuevo Tutor de Curso
            </h1>
            <p class="text-gray-500 text-sm">Rellena los campos obligatorios para registrar un nuevo tutor de curso en el centro.</p>
        </div>

        <div th:if="${message}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-4 rounded-md" role="alert">
            <p th:text="${message}"></p>
        </div>
        <div th:if="${error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded-md" role="alert">
            <p th:text="${error}"></p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-xl">
            <form th:action="@{/admin/tutores-curso/nuevo}" th:object="${tutorCursoCreateDTO}" method="post">
                <div class="mt-6 grid grid-cols-6 gap-6">
                    <div class="col-span-6 sm:col-span-3">
                        <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre *</label>
                        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Juan" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500" />
                        <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="mt-2 text-sm text-red-600"></p>
                    </div>
                    
                    <div class="col-span-6 sm:col-span-3">
                        <label for="apellidos" class="block text-sm font-medium text-gray-700">Apellidos *</label>
                        <input type="text" id="apellidos" th:field="*{apellidos}" placeholder="Ej: García López" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500" />
                        <p th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="mt-2 text-sm text-red-600"></p>
                    </div>

                    <div class="col-span-6 sm:col-span-3">
                        <label for="dni" class="block text-sm font-medium text-gray-700">DNI *</label>
                        <input type="text" id="dni" th:field="*{dni}" placeholder="Ej: 12345678A" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500" />
                        <p th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="mt-2 text-sm text-red-600"></p>
                    </div>

                    <div class="col-span-6 sm:col-span-3">
                        <label for="email" class="block text-sm font-medium text-gray-700">Email *</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="Ej: juan.garcia@centro.es" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500" />
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-2 text-sm text-red-600"></p>
                    </div>
                    
                    <div class="col-span-6 sm:col-span-3">
                        <label for="telefono" class="block text-sm font-medium text-gray-700">Teléfono (Opcional)</label>
                        <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ej: 600123456" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500" />
                        <p th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="mt-2 text-sm text-red-600"></p>
                    </div>

                    <div class="col-span-6 sm:col-span-3">
                        <label for="especialidad" class="block text-sm font-medium text-gray-700">Especialidad (Opcional)</label>
                        <input type="text" id="especialidad" th:field="*{especialidad}" placeholder="Ej: Desarrollo de Aplicaciones Web" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500" />
                        <p th:if="${#fields.hasErrors('especialidad')}" th:errors="*{especialidad}" class="mt-2 text-sm text-red-600"></p>
                    </div>

                    </div>

                <div class="pt-5 border-t border-gray-200 flex justify-end space-x-3 mt-6">
                    <a th:href="@{/admin/tutores-curso}" class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 transition duration-150">
                        <i class="bi bi-x-circle mr-2"></i> Cancelar
                    </a>
                    <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition duration-150">
                        <i class="bi bi-plus-circle mr-2"></i> Crear Tutor
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
